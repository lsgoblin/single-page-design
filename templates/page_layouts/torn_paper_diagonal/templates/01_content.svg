</g>
<g id="lower-paper-picture" data-pptx-placeholder="picture" data-pptx-idx="5" data-pptx-bounds="0 0 1280 720">
 <image id="lower-paper-carrier" data-pptx-carrier="true" href="../images/paper-lower-right.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none" filter="url(#paper-shadow)"/>
</g>
<g id="main-title" data-pptx-placeholder="title" data-pptx-bounds="50 84 490 224">
