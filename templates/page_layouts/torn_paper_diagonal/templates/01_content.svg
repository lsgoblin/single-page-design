 data-pptx-layout="torn_paper_diagonal_main" data-pptx-layout-name="双纸层斜向开窗">
<defs>
 <filter id="paper-shadow" x="-10%" y="-10%" width="120%" height="120%">
  <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#333333" flood-opacity="0.14"/>
 </filter>
</defs>
<rect id="master-background" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
<g id="scene-picture" data-pptx-placeholder="picture" data-pptx-idx="3" data-pptx-bounds="0 0 1280 720">
 <image id="scene-carrier" data-pptx-carrier="true" href="../images/pastoral-scene.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
</g>
<g id="upper-paper-picture" data-pptx-placeholder="picture" data-pptx-idx="4" data-pptx-bounds="0 0 1280 720">
