<line id="information-divider" data-pptx-role="decoration" x1="345" y1="290" x2="345" y2="505" stroke="#999999" stroke-width="1" stroke-dasharray="2,2"/>
<g id="information-1" data-pptx-placeholder="object" data-pptx-binding="proxy" data-pptx-idx="4" data-pptx-bounds="82 280 290 112">
 <use data-icon="imported/clock" x="82" y="299" width="42" height="42" fill="#222222"/>
