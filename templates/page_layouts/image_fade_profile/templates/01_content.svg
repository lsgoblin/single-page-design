 <text x="442" y="376" font-size="15" fill="#555555">{{NOTE_2}}</text>
</g>
<g id="information-3" data-pptx-placeholder="object" data-pptx-binding="proxy" data-pptx-idx="6" data-pptx-bounds="82 405 290 112">
 <use data-icon="imported/map-pin" x="82" y="424" width="42" height="42" fill="#222222"/>
