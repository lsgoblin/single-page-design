 <text x="146" y="345" font-size="28" font-weight="700" fill="#222222">{{VALUE_1}}</text>
 <text x="148" y="376" font-size="15" fill="#555555">{{NOTE_1}}</text>
</g>
<g id="information-2" data-pptx-placeholder="object" data-pptx-binding="proxy" data-pptx-idx="5" data-pptx-bounds="376 280 290 112">
