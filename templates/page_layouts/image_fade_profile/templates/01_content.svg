<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="zh-CN" font-family="Arial" font-size="20"
 data-pptx-master="image_fade_profile_master" data-pptx-master-name="图文渐隐"
 data-pptx-layout="image_fade_profile_content" data-pptx-layout-name="图文渐隐信息页">
<defs>
 <linearGradient id="left-fade" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.28" stop-color="#FFFFFF"/>
  <stop offset="0.43" stop-color="#FFFFFF" stop-opacity="0.98"/><stop offset="0.57" stop-color="#FFFFFF" stop-opacity="0.65"/>
  <stop offset="0.73" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
 </linearGradient>
 <linearGradient id="bottom-fade" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.46"/>
  <stop offset="0.76" stop-color="#FFFFFF" stop-opacity="0.94"/><stop offset="1" stop-color="#FFFFFF"/>
 </linearGradient>
 <linearGradient id="rule-fade" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#222222"/><stop offset="0.65" stop-color="#222222"/>
  <stop offset="1" stop-color="#222222" stop-opacity="0"/>
 </linearGradient>
</defs>
<rect id="master-background" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
<g id="main-picture" data-pptx-placeholder="picture" data-pptx-idx="1" data-pptx-bounds="380 0 900 720">
 <image id="main-picture-carrier" data-pptx-carrier="true" href="../images/sample-photo.png" x="380" y="0" width="900" height="720" preserveAspectRatio="xMidYMid slice"/>
</g>
<rect id="left-fade-overlay" data-pptx-role="decoration" width="1280" height="720" fill="url(#left-fade)"/>
<rect id="bottom-fade-overlay" data-pptx-role="decoration" x="0" y="478" width="1280" height="242" fill="url(#bottom-fade)"/>
<rect id="section-tab" data-pptx-role="decoration" x="0" y="42" width="25" height="56" fill="#222222"/>
<rect id="section-tab-secondary" data-pptx-role="decoration" x="35" y="42" width="12" height="56" fill="#999999"/>
<g id="section-name" data-pptx-placeholder="subtitle" data-pptx-idx="2" data-pptx-bounds="80 43 470 52">
 <text id="section-name-carrier" data-pptx-carrier="true" x="82" y="82" font-size="28" fill="#222222">{{SECTION_NAME}}</text>
</g>
<g id="main-title" data-pptx-placeholder="title" data-pptx-bounds="78 116 560 82">
 <text id="main-title-carrier" data-pptx-carrier="true" x="80" y="175" font-size="46" font-weight="700" fill="#222222">{{TITLE}}</text>
</g>
<g id="main-subtitle" data-pptx-placeholder="body" data-pptx-idx="3" data-pptx-bounds="82 203 560 50">
