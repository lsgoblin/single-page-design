 <text x="148" y="501" font-size="15" fill="#555555">{{NOTE_3}}</text>
</g>
<g id="information-4" data-pptx-placeholder="object" data-pptx-binding="proxy" data-pptx-idx="7" data-pptx-bounds="376 405 290 112">
 <use data-icon="imported/devices" x="376" y="424" width="42" height="42" fill="#222222"/>
 <text x="442" y="430" font-size="18" fill="#444444">{{LABEL_4}}</text>
 <text x="440" y="470" font-size="28" font-weight="700" fill="#222222">{{VALUE_4}}</text>
 <text x="442" y="501" font-size="15" fill="#555555">{{NOTE_4}}</text>
</g>
<rect id="summary-rule" data-pptx-role="decoration" x="0" y="546" width="1070" height="4" fill="url(#rule-fade)"/>
<g id="key-message" data-pptx-placeholder="body" data-pptx-idx="8" data-pptx-bounds="82 567 250 45">
 <text id="key-message-carrier" data-pptx-carrier="true" x="84" y="598" font-size="23" fill="#222222">{{KEY_MESSAGE}}</text>
</g>
<g id="tagline" data-pptx-placeholder="object" data-pptx-binding="proxy" data-pptx-idx="9" data-pptx-bounds="350 568 260 42">
